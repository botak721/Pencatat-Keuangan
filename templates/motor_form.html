{% extends "base.html" %}
{% block sub %}{{ 'Catat Servis' if k else 'Tambah Komponen' }}{% endblock %}
{% block content %}<main class="flex flex-col relative w-full pt-16 pb-28 bg-background min-h-screen"><div class="flex flex-col w-full px-gutter pb-8 gap-y-4 pt-3">
<a href="/motor" class="flex items-center gap-1 text-primary font-label-md text-label-md"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Kembali</a>
{% if k %}<form method="post" action="/motor/servis/simpan" class="flex flex-col gap-y-4" autocomplete="off">
<input type="hidden" name="komponen_id" value="{{ k.id }}">
<h2 class="font-title-md text-title-md">{{ k.nama }}</h2>
<div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Tanggal</label><input name="tanggal" type="date" value="{{ hari }}" class="w-full bg-surface-container-low rounded-xl px-3.5 py-3 outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg"></div>
<div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Odometer saat servis (km)</label><input name="odometer" type="number" inputmode="numeric" min="0" required value="{{ odo }}" class="w-full bg-surface-container-low rounded-xl px-3.5 py-3 outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg"></div>
<div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Biaya (Rp)</label><input name="biaya" type="number" inputmode="numeric" min="0" value="0" class="w-full bg-surface-container-low rounded-xl px-3.5 py-3 outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg"></div>
<div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Catat sebagai pengeluaran dari akun</label><select name="akun_id" class="w-full bg-surface-container-low rounded-xl px-3.5 py-3 outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg"><option value="0">Jangan catat ke keuangan</option>{% for a in akun %}<option value="{{ a.id }}">{{ a.nama }}</option>{% endfor %}</select></div>
<div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Catatan</label><input name="catatan" placeholder="Opsional, mis. bengkel" class="w-full bg-surface-container-low rounded-xl px-3.5 py-3 outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg"></div>
<button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-br from-primary-container to-primary text-on-primary font-title-md text-title-md">Simpan Servis</button></form>
{% else %}<form method="post" action="/motor/komponen/simpan" class="flex flex-col gap-y-4" autocomplete="off">
<div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Nama komponen</label><input name="nama" required placeholder="Mis. Oli Mesin" class="w-full bg-surface-container-low rounded-xl px-3.5 py-3 outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg"></div>
<div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Interval ganti (km)</label><input name="interval_km" type="number" inputmode="numeric" min="1" required placeholder="Mis. 2000" class="w-full bg-surface-container-low rounded-xl px-3.5 py-3 outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg"></div>
<div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Odometer saat terakhir diganti (km)</label><input name="terakhir_km" type="number" inputmode="numeric" min="0" value="{{ odo }}" class="w-full bg-surface-container-low rounded-xl px-3.5 py-3 outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg"></div>
<button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-br from-primary-container to-primary text-on-primary font-title-md text-title-md">Simpan Komponen</button></form>{% endif %}
</div></main>{% endblock %}
