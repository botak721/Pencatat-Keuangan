{% extends "base.html" %}
{% block sub %}Edit Transaksi{% endblock %}
{% block content %}<main class="flex flex-col relative w-full pt-16 pb-28 bg-background min-h-screen"><div class="flex flex-col w-full px-gutter pb-8 gap-y-4 pt-3">
<a href="/transaksi/{{ t.id }}" class="flex items-center gap-1 text-primary font-label-md text-label-md"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Batal</a>
<form method="post" action="/transaksi/{{ t.id }}/simpan" class="flex flex-col gap-y-4" autocomplete="off">
<div class="flex flex-col gap-2"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Nominal (Rp)</label><input name="jumlah" type="number" inputmode="numeric" min="1" required value="{{ t.jumlah }}" class="w-full bg-surface-container-lowest rounded-xl px-3.5 py-3 shadow-sm outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg text-on-surface"></div>
<div class="flex flex-col gap-2"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Kategori</label><select name="kategori" class="w-full bg-surface-container-lowest rounded-xl px-3.5 py-3 shadow-sm outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg text-on-surface">{% for k in kat %}<option {{ 'selected' if k == t.kategori }}>{{ k }}</option>{% endfor %}</select></div>
<div class="flex flex-col gap-2"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Akun</label><select name="akun_id" class="w-full bg-surface-container-lowest rounded-xl px-3.5 py-3 shadow-sm outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg text-on-surface">{% for a in akun %}<option value="{{ a.id }}" {{ 'selected' if a.id == t.akun_id }}>{{ a.nama }}</option>{% endfor %}</select></div>
<div class="flex flex-col gap-2"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Tanggal</label><input name="tanggal" type="date" value="{{ t.tanggal }}" class="w-full bg-surface-container-lowest rounded-xl px-3.5 py-3 shadow-sm outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg text-on-surface"></div>
<div class="flex flex-col gap-2"><label class="font-label-md text-label-md text-on-surface-variant uppercase">Catatan</label><input name="catatan" value="{{ t.catatan or '' }}" class="w-full bg-surface-container-lowest rounded-xl px-3.5 py-3 shadow-sm outline-none focus:ring-2 focus:ring-primary/40 font-body-lg text-body-lg text-on-surface"></div>
<button type="submit" class="mt-2 w-full py-3.5 rounded-xl bg-gradient-to-br from-primary-container to-primary text-on-primary font-title-md text-title-md">Simpan Perubahan</button></form>
</div></main>{% endblock %}
